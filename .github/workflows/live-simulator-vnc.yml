name: Live Interactive iOS Simulator Web Session

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-simulator-vnc.yml'

permissions:
  contents: write

jobs:
  interactive-session:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Ulgen for iOS Simulator
        run: |
          xcodebuild -project Ulgen.xcodeproj \
            -scheme Ulgen \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build_sim \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot Virtual iPhone and Launch Ulgen
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone 15 Pro|iPhone 15|iPhone 16" | head -n 1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          fi
          echo "Selected virtual device ID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl install "$DEVICE_ID" build_sim/Build/Products/Release-iphonesimulator/Ulgen.app
          xcrun simctl launch "$DEVICE_ID" com.yalp.ulgen
          defaults write com.apple.iphonesimulator AllowFullscreenMode -bool NO || true
          open -a Simulator
          sleep 2
          osascript -e 'tell application "Simulator" to activate' || true
          echo "Simulator window opened on macOS Aqua desktop."

      - name: Enable macOS Native Screen Sharing (VNC Server)
        run: |
          echo "Creating dedicated ARD user 'ulgen' with password 'ulgen123'..."
          sudo dscl . -create /Users/ulgen || true
          sudo dscl . -create /Users/ulgen UserShell /bin/bash || true
          sudo dscl . -create /Users/ulgen RealName "Ulgen" || true
          sudo dscl . -create /Users/ulgen UniqueID "1002" || true
          sudo dscl . -create /Users/ulgen PrimaryGroupID 20 || true
          sudo dscl . -create /Users/ulgen NFSHomeDirectory /Users/ulgen || true
          sudo mkdir -p /Users/ulgen && sudo chown -R 1002:20 /Users/ulgen || true
          sudo dscl . -passwd /Users/ulgen "ulgen123"
          sudo dscl . -append /Groups/admin GroupMembership ulgen || true
          
          # Enable screensharing launch daemon (Required for macOS 14 Sonoma)
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true
          sudo launchctl enable system/com.apple.screensharing || true

          # Enable legacy VNC password and full remote access for all users
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "ulgen123" \
            -restart -agent -console

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -users ulgen -access -on -privs -all || true

          # Verify port 5900 is listening
          echo "Waiting for port 5900 to listen..."
          PORT_OPEN=0
          for i in {1..20}; do
            if nc -zv 127.0.0.1 5900 2>&1 | grep -q -E "succeeded|open"; then
              echo "Port 5900 is listening and verified!"
              PORT_OPEN=1
              break
            fi
            sleep 1
          done
          
          if [ $PORT_OPEN -eq 0 ]; then
            echo "Port 5900 check details:"
            sudo lsof -i :5900 || true
            sudo netstat -an | grep 5900 || true
          fi

      - name: Install and Start ARD Web Proxy (noVNC-ARD)
        run: |
          npm install ws
          git clone --recurse-submodules https://github.com/peetinc/noVNC-ARD.git /tmp/novnc-ard
          
          # Bundle all 40 modular JS files into a single instant app-bundle.js
          node tools/bundle-ard.js /tmp/novnc-ard
          
          # Launch integrated Node.js HTTP + WebSocket server bridging directly to Screen Sharing port 5900
          nohup node tools/web-server.js /tmp/novnc-ard 6080 5900 > /tmp/webserver.log 2>&1 &
          
          # Verify local HTTP response
          for i in {1..15}; do
            sleep 1
            if curl -s -I http://127.0.0.1:6080/ard.html | grep -q "200 OK"; then
              echo "noVNC-ARD Node server verified and responding with 200 OK!"
              break
            fi
          done
          cat /tmp/webserver.log || true

      - name: Install Cloudflare Tunnel
        run: |
          brew install cloudflare/cloudflare/cloudflared

      - name: Expose Web Tunnels (Cloudflare + Pinggy + Localtunnel)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Start Cloudflare Tunnel
          nohup cloudflared tunnel --url http://127.0.0.1:6080 --no-chunked-encoding > /tmp/cloudflared.log 2>&1 &
          
          # Start Pinggy Tunnel (SSH HTTPS tunnel with WebSocket support)
          nohup ssh -p 443 -R0:localhost:6080 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 a.pinggy.io > /tmp/pinggy.log 2>&1 &

          # Start Localtunnel in parallel as an additional tunnel
          nohup npx -y localtunnel --port 6080 > /tmp/localtunnel.log 2>&1 &
          
          echo "Waiting for Tunnel URLs..."
          TUNNEL_URL=""
          for i in {1..25}; do
            sleep 2
            TUNNEL_URL=$(grep -o 'https://[-0-9a-z]*\.trycloudflare.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
          done

          PINGGY_URL=""
          for i in {1..15}; do
            PINGGY_URL=$(grep -o 'https://[-0-9a-z]*\.free\.pinggy\.link' /tmp/pinggy.log | head -n 1 || true)
            if [ -n "$PINGGY_URL" ]; then
              break
            fi
            sleep 1
          done

          LOCAL_URL=""
          for i in {1..15}; do
            LOCAL_URL=$(grep -o 'https://[-0-9a-z]*\.loca\.lt' /tmp/localtunnel.log | head -n 1 || true)
            if [ -n "$LOCAL_URL" ]; then
              break
            fi
            sleep 1
          done

          CLOUDFLARE_LINK="${TUNNEL_URL}/ard.html?autoconnect=true&username=ulgen&password=ulgen123&ardSessionType=share&resize=scale"
          PINGGY_LINK="${PINGGY_URL}/ard.html?autoconnect=true&username=ulgen&password=ulgen123&ardSessionType=share&resize=scale"
          LOCALTUNNEL_LINK="${LOCAL_URL}/ard.html?autoconnect=true&username=ulgen&password=ulgen123&ardSessionType=share&resize=scale"
          
          echo "LIVE_URL=$CLOUDFLARE_LINK" >> $GITHUB_ENV

          echo "================================================================="
          echo "🌐 CLOUDFLARE: $CLOUDFLARE_LINK"
          if [ -n "$PINGGY_URL" ]; then
            echo "⚡ PINGGY: $PINGGY_LINK"
          fi
          if [ -n "$LOCAL_URL" ]; then
            echo "🚀 LOCALTUNNEL: $LOCALTUNNEL_LINK"
          fi
          echo "================================================================="

          # Write to Step Summary
          echo "## 📱 Canlı Sanal iPhone Web Erişim Linkleri" >> $GITHUB_STEP_SUMMARY
          echo "1. **[Cloudflare Bağlantısı]($CLOUDFLARE_LINK)**" >> $GITHUB_STEP_SUMMARY
          if [ -n "$PINGGY_URL" ]; then
            echo "2. **[Pinggy Doğrudan Bağlantı]($PINGGY_LINK)**" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$LOCAL_URL" ]; then
            echo "3. **[Alternatif Bağlantı (Localtunnel)]($LOCALTUNNEL_LINK)**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Kullanıcı:** \`ulgen\`" >> $GITHUB_STEP_SUMMARY
          echo "- **VNC Şifresi:** \`ulgen123\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Aktif Süre:** 60 dakika" >> $GITHUB_STEP_SUMMARY

          # Save URL to release
          cat << EOF > live_session_url.txt
          Cloudflare: $CLOUDFLARE_LINK
          Pinggy: $PINGGY_LINK
          Localtunnel: $LOCALTUNNEL_LINK
          EOF
          gh release delete live-session --yes --cleanup-tag || gh release delete live-session --yes || true
          git push origin :refs/tags/live-session || true
          gh release create live-session live_session_url.txt \
            --title "Canlı Sanal iPhone Oturumu" \
            --notes "Canlı web bağlantı linki: $CLOUDFLARE_LINK (Alternatif: $LOCALTUNNEL_LINK)" || true
          git push origin :refs/tags/live-session || true
          gh release create live-session live_session_url.txt \
            --title "Canlı Sanal iPhone Oturumu" \
            --notes "Canlı web bağlantı linki: $FULL_LINK" || true

      - name: Keep Interactive Session Alive (60 Minutes)
        run: |
          echo "Interactive session is LIVE and running at: ${{ env.LIVE_URL }}"
          echo "Sleeping for 3600 seconds (1 hour)..."
          sleep 3600
