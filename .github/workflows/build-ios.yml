name: Build iOS IPA and Virtual Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project Ulgen.xcodeproj \
            -scheme Ulgen \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build_sim \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot Virtual iPhone and Capture Screenshot
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Selected virtual device ID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          sleep 8
          xcrun simctl install "$DEVICE_ID" build_sim/Build/Products/Release-iphonesimulator/Ulgen.app
          xcrun simctl launch "$DEVICE_ID" com.yalp.ulgen
          sleep 6
          xcrun simctl io "$DEVICE_ID" screenshot screenshot_iphone.png || xcrun simctl io booted screenshot screenshot_iphone.png
          ls -lh screenshot_iphone.png
          echo "Virtual iPhone screenshot captured successfully!"

      - name: Build for ARM64 iOS Device
        run: |
          xcodebuild -project Ulgen.xcodeproj \
            -scheme Ulgen \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build_device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa for SideStore
        run: |
          mkdir -p Payload
          cp -r build_device/Build/Products/Release-iphoneos/Ulgen.app Payload/
          zip -r -9 Ulgen.ipa Payload/
          ls -lh Ulgen.ipa

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ulgen-iOS-Package
          path: |
            Ulgen.ipa
            screenshot_iphone.png

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 Ulgen.ipa screenshot_iphone.png \
            --title "Ülgen iOS v1.0.0 (iPhone 17 & SideStore Uyumlu)" \
            --notes "SideStore ile iPhone 17'ye doğrudan yüklenmeye hazır imzasız .ipa paketi. Cihazlar arası anlık MQTT senkronizasyonu ve Taptic Engine desteği entegredir." \
            --target ${{ github.sha }} || true
