name: Build Native iOS IPA and Virtual Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project Ulgen.xcodeproj \
            -scheme Ulgen \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build_sim \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot Modern Virtual iPhone (19.5:9 Aspect Ratio) and Capture Screenshots
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone 15 Pro|iPhone 15|iPhone 16" | head -n 1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          fi
          echo "Selected virtual device ID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          sleep 4
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl install "$DEVICE_ID" build_sim/Build/Products/Release-iphonesimulator/Ulgen.app
          
          mkdir -p screenshots_ios
          
          echo "Capturing Screen 1: Dashboard"
          xcrun simctl launch "$DEVICE_ID" com.yalp.ulgen -screen dashboard
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot screenshots_ios/ios_01_dashboard.png
          xcrun simctl terminate "$DEVICE_ID" com.yalp.ulgen || true
          sleep 1

          echo "Capturing Screen 2: Side Drawer"
          xcrun simctl launch "$DEVICE_ID" com.yalp.ulgen -screen drawer
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot screenshots_ios/ios_02_drawer.png
          xcrun simctl terminate "$DEVICE_ID" com.yalp.ulgen || true
          sleep 1

          echo "Capturing Screen 3: Sort Accordion"
          xcrun simctl launch "$DEVICE_ID" com.yalp.ulgen -screen sort
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot screenshots_ios/ios_03_sort.png
          xcrun simctl terminate "$DEVICE_ID" com.yalp.ulgen || true
          sleep 1

          echo "Capturing Screen 4: Dual Zipper Accordion"
          xcrun simctl launch "$DEVICE_ID" com.yalp.ulgen -screen dual_zipper
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot screenshots_ios/ios_04_dual_zipper.png
          xcrun simctl terminate "$DEVICE_ID" com.yalp.ulgen || true
          sleep 1

          echo "Capturing Screen 5: Detail View"
          xcrun simctl launch "$DEVICE_ID" com.yalp.ulgen -screen detail
          sleep 4
          xcrun simctl io "$DEVICE_ID" screenshot screenshots_ios/ios_05_detail.png
          xcrun simctl terminate "$DEVICE_ID" com.yalp.ulgen || true
          sleep 1

          echo "Capturing Screen 6: Media Manager Modal"
          xcrun simctl launch "$DEVICE_ID" com.yalp.ulgen -screen media
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot screenshots_ios/ios_06_media.png
          xcrun simctl terminate "$DEVICE_ID" com.yalp.ulgen || true
          sleep 1

          echo "Capturing Screen 7: MChat AI Modal"
          xcrun simctl launch "$DEVICE_ID" com.yalp.ulgen -screen mchat
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot screenshots_ios/ios_07_mchat.png
          xcrun simctl terminate "$DEVICE_ID" com.yalp.ulgen || true
          sleep 1

          echo "Capturing Screen 8: Coming Soon Modal"
          xcrun simctl launch "$DEVICE_ID" com.yalp.ulgen -screen coming_soon
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot screenshots_ios/ios_08_coming_soon.png
          xcrun simctl terminate "$DEVICE_ID" com.yalp.ulgen || true

          cp screenshots_ios/ios_01_dashboard.png screenshot_iphone.png
          cd screenshots_ios && zip -r ../all_ios_screenshots.zip *.png && cd ..
          ls -lh screenshots_ios/
          echo "All 8 Virtual iPhone screenshots captured successfully!"

      - name: Build for ARM64 iOS Device
        run: |
          xcodebuild -project Ulgen.xcodeproj \
            -scheme Ulgen \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build_device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa for SideStore
        run: |
          mkdir -p Payload
          cp -r build_device/Build/Products/Release-iphoneos/Ulgen.app Payload/
          zip -r -9 Ulgen.ipa Payload/
          ls -lh Ulgen.ipa

      - name: Package Simulator App for Web/Browser Testing
        run: |
          cd build_sim/Build/Products/Release-iphonesimulator
          zip -r -9 ../../../../Ulgen-Simulator.zip Ulgen.app
          cd ../../../../
          ls -lh Ulgen-Simulator.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ulgen-iOS-Package
          path: |
            Ulgen.ipa
            Ulgen-Simulator.zip
            screenshot_iphone.png
            all_ios_screenshots.zip
            screenshots_ios/*.png

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.3.3 --yes || true
          gh release create v1.3.3 Ulgen.ipa Ulgen-Simulator.zip screenshot_iphone.png all_ios_screenshots.zip \
            --title "Ülgen iOS v1.3.3 (1:1 Android Parity, Real MQTT 3.1.1 Sync, Dual Accordion, Generic Profile)" \
            --notes "1:1 Android Kotlin/Compose Tam Parite Paketi:
            - Dual Accordion Paritesi: Sıralama Ölçütü ve Filtreler akordeonu Android DashboardScreen.kt ile 1:1 çift sütunlu fermuar yerleşimine kavuşturuldu, iki panel aynı anda açıldığında yan yana (50/50) konumlanıyor.
            - Gerçek MQTT 3.1.1 Senkronizasyonu: HiveMQ TCP (1883) üzerinden standart ikili MQTT çerçevelemesi ve 24 karakterlik SHA-256 konu eşleşmesi (ulgen/account/{hash24}) sağlandı; Android ve iOS arasında anlık çift yönlü senkronizasyon çalışıyor.
            - Cloudflare Worker KV Entegrasyonu: Proje değişiklikleri ve kullanıcı adı doğrulaması takip-backend üzerinde eşzamanlanıyor.
            - Sıfır Hardcoding / Genel Kullanıcı Mimarisi: Tüm kişisel geliştirici cihaz adları (S25+, Tab S9) ve sabit test e-postaları temizlendi; her kullanıcı kendi hesabını bağlayabilir.
            - Tam Profil Ekranı (ProfileScreen.kt): Kullanıcı profili, bulut eşitleme, AI API havuzu (Gemini, OpenAI, Claude, DeepSeek) ve yerel veri yönetimi.
            - Hareket ve Animasyonlar: Pull-to-refresh (kaydırarak yenileme), alt arşiv çekme butonu ve yay animasyonları." \
            --target ${{ github.sha }} || true
