name: Ulgen
options:
  bundleIdPrefix: com.yalp
  deploymentTarget:
    iOS: "16.0"
targets:
  Ulgen:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Ulgen/Sources
      - path: Ulgen/Resources/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yalp.ulgen
      PRODUCT_NAME: Ulgen
      INFOPLIST_FILE: Ulgen/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      SWIFT_VERSION: "5.0"
